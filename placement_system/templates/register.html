{% extends "base.html" %}
{% block title %}Register | CampusPlace{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">
    <div class="card auth-card">
      <div class="card-body p-4">
        <h3 class="fw-bold text-center mb-4"><i class="fa-solid fa-user-plus me-2"></i>Student Registration</h3>
        <form method="POST">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Full Name *</label>
              <input type="text" name="name" class="form-control" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Roll No *</label>
              <input type="text" name="roll_no" class="form-control" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Email *</label>
              <input type="email" name="email" class="form-control" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Password *</label>
              <input type="password" name="password" class="form-control" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Branch *</label>
              <select name="branch" class="form-select" required>
                <option value="">Select Branch</option>
                <option>Computer Science</option>
                <option>Information Technology</option>
                <option>Electronics</option>
                <option>Mechanical</option>
                <option>Civil</option>
                <option>Electrical</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label">CGPA *</label>
              <input type="number" step="0.01" min="0" max="10" name="cgpa" class="form-control" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Phone</label>
              <input type="text" name="phone" class="form-control">
            </div>
            <div class="col-md-6">
              <label class="form-label">Resume Link</label>
              <input type="url" name="resume_link" class="form-control" placeholder="https://...">
            </div>
          </div>
          <button type="submit" class="btn btn-primary-custom w-100 mt-4">Register</button>
        </form>
        <p class="text-center mt-3 mb-0">Already registered? <a href="{{ url_for('login') }}">Login here</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
